  <path d="M 264,188 C 270,168 282,150 296,140" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <circle cx="215" cy="139" r="3.5" fill="#fef08a" />
  <circle cx="297" cy="139" r="3.5" fill="#fef08a" />
